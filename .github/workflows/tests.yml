name: SignalCore validation and API checks
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile server and engine
        run: python -m compileall -q server.py gsm_sim tests
      - name: Validate Python simulation and API endpoints
        run: python -m pytest -q
